    <script>
      // Filter benign Vite development websocket connection logs in iframe preview
      (function() {
        var originalError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && firstArg.indexOf('[vite]') !== -1 && firstArg.indexOf('websocket') !== -1) {
            if (console.debug) {
              console.debug.apply(console, arguments);
            }
            return;
          }
          return originalError.apply(console, arguments);
        };
      })();

      try {
        var rawData = localStorage.getItem('leve_app_data');
        if (rawData) {
          var parsed = JSON.parse(rawData);
          if (parsed && parsed.user && parsed.user.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
